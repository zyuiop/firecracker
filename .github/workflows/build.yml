name: Build / release

on:
  push:
    tags:
      - v*

jobs:
  check-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build
        run: |
          ./tools/devtool -y build --release
      - name: Publish
        run: gh release create ${{ github.ref }} --title ${{ github.ref }} build/cargo_target/x86_64-unknown-linux-musl/release/firecracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
